# V2 engineering defaults; source development precedes held-building evaluation.
output: outputs/anchor_v2_dev
targets: [B0F1, B1F3]
repeats: [0]
source_buildings: [0, 1]
representations: [anchor]
anchor:
  neighbors: 5
  hidden: [256, 128, 64, 32]
  rounds: 1000
  inner_steps: 5
  inner_lr: 0.01
  outer_lr: 0.001
